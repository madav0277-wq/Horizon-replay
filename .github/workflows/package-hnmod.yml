name: Package Horizon Replay

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and verify .hnmod
        run: python tools/package_hnmod.py
      - name: Upload .hnmod
        uses: actions/upload-artifact@v4
        with:
          name: horizon-replay-hnmod
          path: dist/horizon_replay.hnmod
          if-no-files-found: error
