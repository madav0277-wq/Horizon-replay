name: Verify and package Horizon Replay

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile and test replay implementation against pinned Android API
        run: cargo test --manifest-path ci/Cargo.toml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Package native mod
        run: python packaging/package_hnmod.py
      - name: Upload .hnmod
        uses: actions/upload-artifact@v4
        with:
          name: horizon-replay-hnmod
          path: dist/horizon-replay.hnmod
          if-no-files-found: error
